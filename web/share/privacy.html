<!DOCTYPE html>
<!-- REDIRECT STUB. The policy itself moved to muse-photo.com/privacy — the
     app's own domain. Hosting it here, on the domain named after one optional
     feature, meant the app's legal links pointed at the share site.

     Kept rather than deleted because this URL is out in the wild: it shipped
     inside the app's About modal and sits in every share page's footer. Both a
     meta refresh and a visible link, because a stub whose refresh is blocked
     must still be navigable by hand.

     The #how-it-works anchor is preserved on the new page; the app linked
     straight to it.

     Google's OAuth consent screen also names a privacy-policy URL. Update it in
     the Cloud console to the muse-photo.com address — this stub will satisfy a
     crawler, but the console field should point at the real page. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <meta http-equiv="refresh" content="0; url=https://muse-photo.com/privacy">
  <link rel="canonical" href="https://muse-photo.com/privacy">
  <title>Muse — Privacy Policy</title>
  <link rel="icon" type="image/png" href="favicon-light.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" href="favicon-dark.png" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" href="favicon-light.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon-v2.png" />
  <link rel="stylesheet" href="legal.css">
</head>
<body>
  <main>
    <h1>Privacy Policy</h1>
    <p class="lede">Muse's privacy policy has moved to
       <a href="https://muse-photo.com/privacy">muse-photo.com/privacy</a>.</p>
    <p>You should be sent there automatically. If nothing happens, follow the
       link above.</p>
  </main>
</body>
</html>
